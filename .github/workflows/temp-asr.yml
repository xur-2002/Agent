name: Temp ASR

on:
  push:
    branches:
      - temp-asr-20260910
    paths:
      - 'asr/READY'

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-asr-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Decode audio
        run: |
          base64 -d asr/input.b64 > asr/input.webm
          ls -lh asr/input.webm
      - name: Install ASR
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper
      - name: Transcribe Mandarin
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('asr/input.webm', language='zh', vad_filter=True, beam_size=5)
          lines=[]
          for s in segments:
              line=f'[{s.start:.2f}-{s.end:.2f}] {s.text.strip()}'
              print(line)
              lines.append(line)
          open('asr/transcript.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
          python /tmp/transcribe.py
      - name: Save transcript
        run: |
          git config user.name 'temp-asr-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add asr/transcript.txt
          git commit -m 'Write temporary ASR transcript' || exit 0
          git push origin HEAD:temp-asr-20260910
      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript
          path: asr/transcript.txt
          if-no-files-found: ignore
