name: Temp ASR

on:
  push:
    branches:
      - temp-asr-20260910
    paths:
      - 'asr/READY'

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-asr-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Decode test audio
        run: |
          base64 -d asr/input.b64 > asr/input.c2
          ffmpeg -hide_banner -loglevel error -i asr/input.c2 -ar 16000 -ac 1 asr/input.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 asr/input.wav
      - name: Install ASR
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper
      - name: Transcribe Mandarin
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          OFFSET=2130.0
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('asr/input.wav', language='zh', vad_filter=True, beam_size=5)
          lines=[]
          for s in segments:
              line=f'[{s.start+OFFSET:.2f}-{s.end+OFFSET:.2f}] {s.text.strip()}'
              print(line)
              lines.append(line)
          open('asr/transcript_700c.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
          python /tmp/transcribe.py
      - name: Save transcript
        run: |
          git config user.name 'temp-asr-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add asr/transcript_700c.txt
          git commit -m 'Write 700C ASR test transcript' || exit 0
          git push origin HEAD:temp-asr-20260910
