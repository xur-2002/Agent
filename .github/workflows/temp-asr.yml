name: Temp ASR

on:
  push:
    branches:
      - temp-asr-20260910
    paths:
      - 'asr/READY'

permissions:
  contents: read

jobs:
  build-offline-asr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-asr-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build offline faster-whisper bundle
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper
          mkdir -p offline_bundle/wheelhouse offline_bundle/model
          pip download --only-binary=:all: -d offline_bundle/wheelhouse faster-whisper
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p=snapshot_download('Systran/faster-whisper-small', local_dir='offline_bundle/model')
          print('model=', p)
          PY
          du -sh offline_bundle/model offline_bundle/wheelhouse
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: offline-whisper-small-model
          path: offline_bundle/model
          compression-level: 0
          if-no-files-found: error
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: offline-faster-whisper-py313-wheels
          path: offline_bundle/wheelhouse
          compression-level: 0
          if-no-files-found: error
